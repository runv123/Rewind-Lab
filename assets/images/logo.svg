<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <style>
      .brand-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 600; fill: #FF6B00; letter-spacing: 0.5px; }
    </style>
  </defs>
  
  <!-- 胶片外框 -->
  <rect x="20" y="20" width="160" height="140" rx="24" ry="24" fill="#FF6B00"/>
  
  <!-- 胶片齿孔 (上) -->
  <rect x="30" y="30" width="10" height="8" fill="#FFFFFF"/>
  <rect x="50" y="30" width="10" height="8" fill="#FFFFFF"/>
  <rect x="70" y="30" width="10" height="8" fill="#FFFFFF"/>
  <rect x="90" y="30" width="10" height="8" fill="#FFFFFF"/>
  <rect x="110" y="30" width="10" height="8" fill="#FFFFFF"/>
  <rect x="130" y="30" width="10" height="8" fill="#FFFFFF"/>
  <rect x="150" y="30" width="10" height="8" fill="#FFFFFF"/>
  <rect x="170" y="30" width="10" height="8" fill="#FFFFFF"/>
  
  <!-- 胶片齿孔 (下) -->
  <rect x="30" y="142" width="10" height="8" fill="#FFFFFF"/>
  <rect x="50" y="142" width="10" height="8" fill="#FFFFFF"/>
  <rect x="70" y="142" width="10" height="8" fill="#FFFFFF"/>
  <rect x="90" y="142" width="10" height="8" fill="#FFFFFF"/>
  <rect x="110" y="142" width="10" height="8" fill="#FFFFFF"/>
  <rect x="130" y="142" width="10" height="8" fill="#FFFFFF"/>
  <rect x="150" y="142" width="10" height="8" fill="#FFFFFF"/>
  <rect x="170" y="142" width="10" height="8" fill="#FFFFFF"/>
  
  <!-- 播放按钮背景 -->
  <rect x="60" y="60" width="80" height="60" rx="10" ry="10" fill="#FFFFFF"/>
  
  <!-- 播放三角形 -->
  <polygon points="80,75 80,95 100,85" fill="#FF6B00"/>
  
  <!-- 品牌文字 -->
  <text x="100" y="195" text-anchor="middle" class="brand-text">Rewind Lab</text>
</svg>
